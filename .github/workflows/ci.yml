name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: country-tz-kit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and audit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', '20.19.0', '22.15.0', '24.0.0', '24.15.0']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify reproducible metadata
        if: matrix.node == '24.15.0'
        run: npm run check:data

      - name: Typecheck
        run: npm run typecheck

      - name: Build and run test suite
        run: npm test

      - name: Install Chromium
        if: matrix.node == '24.15.0'
        run: npm exec -- playwright-core install --with-deps chromium

      - name: Run browser hydration regression
        if: matrix.node == '24.15.0'
        run: npm run test:browser

      - name: Run release security, identifier, source-map, and license audit
        run: npm run audit:release

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=low
